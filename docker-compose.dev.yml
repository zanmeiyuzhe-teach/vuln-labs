version: '3.8'

services:
  postgres:
    ports:
      - "5432:5432"

  redis:
    ports:
      - "6379:6379"

  server:
    build:
      target: dev
    volumes:
      - ./apps/server:/app
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      SERVER_MODE: debug
    ports:
      - "8080:8080"
      - "2345:2345"

  web:
    volumes:
      - ./apps/web:/app
      - /app/node_modules
      - /app/.next
    environment:
      NODE_ENV: development
